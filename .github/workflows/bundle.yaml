name: Bundle Addon
on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 1. pnpm 먼저 설정 (Node.js setup 전에!)
      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.0"

      # 2. 그 다음 Node.js 설정  
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundle
        run: pnpm run bundle  # npm -> pnpm으로 변경

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: wealthfolio-addon-bundle
          path: dist/*.zip
