name: Bundle Addon

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundle
        run: npm run bundle

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: wealthfolio-addon-bundle
          path: dist/*.zip
