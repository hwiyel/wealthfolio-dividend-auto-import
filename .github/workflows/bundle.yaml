name: Bundle Addon
on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 1. pnpm 먼저 설정
      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.0"

      # 2. pnpm store 경로 가져오기
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      # 3. pnpm store 캐시 설정
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 4. Node.js 설정 (캐시 제거)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install

      - name: Build bundle
        run: pnpm run bundle

      # manifest.json에서 id/version 추출
      - name: Get addon info
        id: addon-info
        run: |
          ID=$(jq -r '.id' manifest.json)
          VERSION=$(jq -r '.version' manifest.json)
          ZIP_NAME="${ID}-${VERSION}.zip"
          echo "addon-id=$ID" >> $GITHUB_OUTPUT
          echo "addon-version=$VERSION" >> $GITHUB_OUTPUT
          echo "zip-name=$ZIP_NAME" >> $GITHUB_OUTPUT

      # ZIP 파일명 동적 생성
      - name: Rename and upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.addon-info.outputs.zip-name }}
          path: dist/*.zip

